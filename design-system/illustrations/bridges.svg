<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 16 700 250" role="img" aria-labelledby="tbr" style="max-width:100%;height:auto">
  <title id="tbr">Stick figure on a ledge looking at three bridges. Only one reaches the far side.</title>
  <rect x="-600" y="-600" width="2400" height="2400" fill="#ffffff"/>

  <path d="M-30,194 L150,194 L150,252 L-30,252 Z" fill="#fff" stroke="#111111" stroke-width="3.2"/>
  <g stroke="#111111" stroke-width="1.4" opacity=".5">
    <line x1="-20" y1="252" x2="10" y2="200"/><line x1="10" y1="252" x2="40" y2="200"/>
    <line x1="40" y1="252" x2="70" y2="200"/><line x1="70" y1="252" x2="100" y2="200"/>
    <line x1="100" y1="252" x2="130" y2="200"/>
  </g>
  <path d="M470,194 L620,194 L620,252 L470,252 Z" fill="#fff" stroke="#111111" stroke-width="3.2"/>
  <g stroke="#111111" stroke-width="1.4" opacity=".5">
    <line x1="480" y1="252" x2="510" y2="200"/><line x1="510" y1="252" x2="540" y2="200"/>
    <line x1="540" y1="252" x2="570" y2="200"/><line x1="570" y1="252" x2="600" y2="200"/>
  </g>
  <!-- two attempts that stop in mid-air -->
  <path d="M152,188 C196,150 240,142 262,142" fill="none" stroke="#111111" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M262,142 l9,-7 l1,13 l10,-6" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M152,192 C226,180 296,176 330,178" fill="none" stroke="#111111" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M330,178 l10,-6 l1,13 l10,-5" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round"/>
  <!-- the one that lands -->
  <path d="M150,190 C240,230 380,230 470,190" fill="none" stroke="#E4623E" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#E4623E" stroke-width="3" stroke-linecap="round">
    <line x1="196" y1="206" x2="196" y2="219"/><line x1="248" y1="218" x2="248" y2="231"/>
    <line x1="310" y1="222" x2="310" y2="235"/><line x1="372" y1="218" x2="372" y2="231"/>
    <line x1="424" y1="206" x2="424" y2="219"/>
  </g>
  <g transform="translate(-32,0)">
  <!-- head -->
  <circle cx="80" cy="54" r="20" fill="#fff" stroke="#111111" stroke-width="3.2"/>
  <!-- baseball cap: crown + peak, white with cross-hatching, never coloured -->
  <defs>
    <clipPath id="crown-br"><path d="M60.5,45 C60,20 100,19.5 99.5,45 Z"/></clipPath>
  </defs>
  <path d="M60.5,45 C60,20 100,19.5 99.5,45" fill="#fff" stroke="#111111" stroke-width="3.2" stroke-linejoin="round"/>
  <g clip-path="url(#crown-br)" stroke="#111111" stroke-width="1.5" opacity=".7">
    <line x1="62" y1="47" x2="82" y2="21"/>
    <line x1="71" y1="47" x2="91" y2="22"/>
    <line x1="80" y1="47" x2="99" y2="26"/>
    <line x1="89" y1="47" x2="101" y2="34"/>
  </g>
  <path d="M98.5,45 C110,41 122,44 127,50.5 C118,54.5 105,52.5 98,48.5 Z"
    fill="#fff" stroke="#111111" stroke-width="3.2" stroke-linejoin="round"/>
  <line x1="60.5" y1="45" x2="99.5" y2="45" stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
  <!-- face: dot eyes, curved mouth, short angled brows. no nose, no ears -->
  <circle cx="73" cy="59" r="2.5" fill="#111111"/>
  <circle cx="87" cy="59" r="2.5" fill="#111111"/>
  <line x1="68.5" y1="52.5" x2="77" y2="50.5" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="83" y1="50.5" x2="91.5" y2="52.5" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M73,67 Q80,72.5 87,66.5" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round"/>
  <!-- neck, torso, legs -->
  <g fill="none" stroke="#111111" stroke-width="3.4" stroke-linecap="round">
    <line x1="80" y1="74" x2="80" y2="84"/>
    <path d="M80,84 L80.5,140"/>
    <path d="M80.5,140 L62,192"/>
    <path d="M80.5,140 L98.5,191"/>
    <line x1="62" y1="192" x2="53" y2="192.5"/>
    <line x1="98.5" y1="191" x2="107" y2="192"/>
  </g>
  <path d="M80,96 L58,124" stroke="#111111" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M80,96 L116,90" stroke="#111111" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
