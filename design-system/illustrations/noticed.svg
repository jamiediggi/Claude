<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 20 295 200" role="img" aria-labelledby="tno" style="max-width:100%;height:auto">
  <title id="tno">Stick figure holding a megaphone with sound lines coming out of it.</title>
  <rect x="-800" y="-800" width="3000" height="3000" fill="#ffffff"/>

  
