    <line x1="28" y1="64" x2="40" y2="50"/><line x1="35" y1="65" x2="47" y2="51"/>
    <line x1="42" y1="65" x2="54" y2="51"/><line x1="49" y1="64" x2="60" y2="53"/>
  </g>
  <defs><clipPath id="brim-no"><path d="M63,47 C48,45 29,51 25,59 C31,66 50,63 64,54 Z"/></clipPath></defs>
  <!-- face: oval eyes, thick angled brows, small curled nose, curved smile -->
  <ellipse cx="70" cy="61" rx="3.1" ry="4.4" fill="#111111"/>
  <ellipse cx="85" cy="61" rx="3.1" ry="4.4" fill="#111111"/>
