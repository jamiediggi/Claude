  <path d="M73,126 C71,152 70,178 70,192" fill="none" stroke="#111111" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M89,126 C91,152 92,178 92,192" fill="none" stroke="#111111" stroke-width="3.8" stroke-linecap="round"/>
  <ellipse cx="64" cy="196" rx="10" ry="5.5" fill="#111111" transform="rotate(-6 64 196)"/>
