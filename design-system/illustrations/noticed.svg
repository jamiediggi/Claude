    <line x1="95" y1="54" x2="104" y2="44"/>
  </g>
  <defs><clipPath id="cap-no"><path d="M59,52 C60,32 100,29 102,54 C90,46 71,46 59,52 Z"/></clipPath></defs>
  <!-- brim, sweeping forward-left, hatched underneath -->
