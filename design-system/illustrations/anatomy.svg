<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 12 900 250" role="img" aria-labelledby="tan" style="max-width:100%;height:auto">
  <title id="tan">Anatomy of the stick figure: round head, baseball cap, four head-heights tall, black ink only.</title>
  <rect x="-600" y="-600" width="2400" height="2400" fill="#ffffff"/>

  <!-- height measure -->
  <g stroke="#1A4081" stroke-width="1.6">
    <line x1="18" y1="34" x2="18" y2="194" stroke-dasharray="4 4"/>
    <line x1="12" y1="34" x2="24" y2="34"/><line x1="12" y1="74" x2="24" y2="74"/>
    <line x1="12" y1="114" x2="24" y2="114"/><line x1="12" y1="154" x2="24" y2="154"/>
    <line x1="12" y1="194" x2="24" y2="194"/>
  </g>
  <text x="18" y="213" text-anchor="middle" font-family="Gabarito, Trebuchet MS, sans-serif" font-size="13" font-weight="700" fill="#111111" fill="#1A4081">4 heads</text>
  
  <!-- head -->
  <circle cx="80" cy="54" r="20" fill="#fff" stroke="#111111" stroke-width="3.2"/>
  <!-- baseball cap: crown + peak, white with cross-hatching, never coloured -->
  <defs>
    <clipPath id="crown-an"><path d="M60.5,45 C60,20 100,19.5 99.5,45 Z"/></clipPath>
  </defs>
  <path d="M60.5,45 C60,20 100,19.5 99.5,45" fill="#fff" stroke="#111111" stroke-width="3.2" stroke-linejoin="round"/>
  <g clip-path="url(#crown-an)" stroke="#111111" stroke-width="1.5" opacity=".7">
    <line x1="62" y1="47" x2="82" y2="21"/>
    <line x1="71" y1="47" x2="91" y2="22"/>
    <line x1="80" y1="47" x2="99" y2="26"/>
    <line x1="89" y1="47" x2="101" y2="34"/>
  </g>
  <path d="M98.5,45 C110,41 122,44 127,50.5 C118,54.5 105,52.5 98,48.5 Z"
    fill="#fff" stroke="#111111" stroke-width="3.2" stroke-linejoin="round"/>
  <line x1="60.5" y1="45" x2="99.5" y2="45" stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
  <!-- face: dot eyes, curved mouth, short angled brows. no nose, no ears -->
  <circle cx="73" cy="59" r="2.5" fill="#111111"/>
  <circle cx="87" cy="59" r="2.5" fill="#111111"/>
  <line x1="68.5" y1="52.5" x2="77" y2="50.5" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="83" y1="50.5" x2="91.5" y2="52.5" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M73,67 Q80,72.5 87,66.5" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round"/>
  <!-- neck, torso, legs -->
  <g fill="none" stroke="#111111" stroke-width="3.4" stroke-linecap="round">
    <line x1="80" y1="74" x2="80" y2="84"/>
    <path d="M80,84 L80.5,140"/>
    <path d="M80.5,140 L62,192"/>
    <path d="M80.5,140 L98.5,191"/>
    <line x1="62" y1="192" x2="53" y2="192.5"/>
    <line x1="98.5" y1="191" x2="107" y2="192"/>
  </g>
  <path d="M80,96 L58,122" stroke="#111111" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M80,96 L103,120" stroke="#111111" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <line x1="40" y1="194" x2="300" y2="194" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <!-- accents live on props only -->
  <rect x="228" y="158" width="46" height="36" rx="3" fill="#1A4081"/>
  <line x1="228" y1="176" x2="274" y2="176" stroke="#fff" stroke-width="2"/>
  <line x1="251" y1="158" x2="251" y2="194" stroke="#fff" stroke-width="2"/>
  <line x1="292" y1="194" x2="292" y2="120" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <path d="M292,122 L328,132 L292,144 Z" fill="#E4623E"/>
  <!-- leaders: each points at the thing its label names -->
  <g stroke="#1A4081" stroke-width="1.4" stroke-dasharray="3 4" fill="none">
    <path d="M127,49 L160,34 L352,34"/>
    <path d="M100,52 L160,74 L352,74"/>
    <path d="M91,63 L160,114 L352,114"/>
    <path d="M82,118 L160,154 L352,154"/>
    <path d="M300,150 L330,194 L352,194"/>
  </g>
  <g font-family="Gabarito, Trebuchet MS, sans-serif" font-size="13" font-weight="700" fill="#111111">
    <text x="360" y="38">Baseball cap, always. White with cross-hatching, never coloured.</text>
    <text x="360" y="78">Round head, slightly oversized. White inside, black outline.</text>
    <text x="360" y="118">Dot eyes, curved mouth, short angled brows. No nose, no ears.</text>
    <text x="360" y="158">Black ink only. The character himself is never coloured.</text>
    <text x="360" y="198">Accent colours live on props and environment only.</text>
  </g>
</svg>
