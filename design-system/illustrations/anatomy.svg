<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 8 920 258" role="img" aria-labelledby="tan" style="max-width:100%;height:auto">
  <title id="tan">Anatomy of the stick figure: egg head, baseball cap, T-shirt, mitten hands and shoe-blob feet.</title>
  <rect x="-800" y="-800" width="3000" height="3000" fill="#ffffff"/>

  <g stroke="#1A4081" stroke-width="1.6">
    <line x1="18" y1="34" x2="18" y2="202" stroke-dasharray="4 4"/>
    <line x1="12" y1="34" x2="24" y2="34"/><line x1="12" y1="82" x2="24" y2="82"/>
    <line x1="12" y1="130" x2="24" y2="130"/><line x1="12" y1="178" x2="24" y2="178"/>
    <line x1="12" y1="202" x2="24" y2="202"/>
  </g>
  <text x="18" y="221" text-anchor="middle" font-family="Gabarito, Trebuchet MS, sans-serif" font-size="13" font-weight="700" fill="#111111" fill="#1A4081">3.5 heads</text>
  
  <!-- head: egg-shaped, white, heavy outline -->
  <path d="M80,34 C95,34 103,46 103,59 C103,73 94,82 80,82 C66,82 58,73 58,59 C58,46 65,34 80,34 Z"
    fill="#fff" stroke="#111111" stroke-width="4.2" stroke-linejoin="round"/>
  <!-- baseball cap: crown, button, panel seams, brim. white, never coloured -->
  <path d="M59,52 C60,32 100,29 102,54 C90,46 71,46 59,52 Z"
    fill="#fff" stroke="#111111" stroke-width="4.2" stroke-linejoin="round"/>
  <circle cx="81" cy="30.5" r="2.6" fill="#fff" stroke="#111111" stroke-width="2.4"/>
  <path d="M81,33 C75,39 69,46 65,50" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M81,33 C88,38 95,45 99,51" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
  <g clip-path="url(#cap-an)" stroke="#111111" stroke-width="1.5" opacity=".8">
    <line x1="84" y1="52" x2="99" y2="34"/><line x1="90" y1="53" x2="103" y2="38"/>
    <line x1="95" y1="54" x2="104" y2="44"/>
  </g>
  <defs><clipPath id="cap-an"><path d="M59,52 C60,32 100,29 102,54 C90,46 71,46 59,52 Z"/></clipPath></defs>
  <!-- brim, sweeping forward-left, hatched underneath -->
  <path d="M63,47 C48,45 29,51 25,59 C31,66 50,63 64,54 Z"
    fill="#fff" stroke="#111111" stroke-width="4.2" stroke-linejoin="round"/>
  <g clip-path="url(#brim-an)" stroke="#111111" stroke-width="1.5" opacity=".8">
    <line x1="28" y1="64" x2="40" y2="50"/><line x1="35" y1="65" x2="47" y2="51"/>
    <line x1="42" y1="65" x2="54" y2="51"/><line x1="49" y1="64" x2="60" y2="53"/>
  </g>
  <defs><clipPath id="brim-an"><path d="M63,47 C48,45 29,51 25,59 C31,66 50,63 64,54 Z"/></clipPath></defs>
  <!-- face: oval eyes, thick angled brows, small curled nose, curved smile -->
  <ellipse cx="70" cy="61" rx="3.1" ry="4.4" fill="#111111"/>
  <ellipse cx="85" cy="61" rx="3.1" ry="4.4" fill="#111111"/>
  <path d="M64.5,54 C67,51.5 71,51.5 73.5,53.5" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M81,53.5 C83.5,51.5 87.5,51.5 90,54" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M77,66 C74,69 75,72 78,71.5" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M70,75 C75,80 83,79 87,74" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round"/>
  <!-- neck -->
  <line x1="80" y1="82" x2="80" y2="89" stroke="#111111" stroke-width="3.8" stroke-linecap="round"/>
  <!-- t-shirt with short sleeves -->
  <path d="M80,89 C72,89 66,91 62,95 C59,98 57,102 56,105 C59,107 63,107 66,105
           C65,114 65,121 64,127 C72,129 88,129 96,127 C95,121 95,114 94,105
           C97,107 101,107 104,105 C103,102 101,98 98,95 C94,91 88,89 80,89 Z"
    fill="#fff" stroke="#111111" stroke-width="4.2" stroke-linejoin="round"/>
  <path d="M58,104 C52,112 48,120 46,127" fill="none" stroke="#111111" stroke-width="3.8" stroke-linecap="round"/>
  <ellipse cx="45" cy="131" rx="5.5" ry="7" fill="#111111" transform="rotate(14 45 131)"/>
  <path d="M102,104 C108,112 112,120 114,127" fill="none" stroke="#111111" stroke-width="3.8" stroke-linecap="round"/>
  <ellipse cx="115" cy="131" rx="5.5" ry="7" fill="#111111" transform="rotate(-14 115 131)"/>
  <path d="M73,126 C71,152 70,178 70,192" fill="none" stroke="#111111" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M89,126 C91,152 92,178 92,192" fill="none" stroke="#111111" stroke-width="3.8" stroke-linecap="round"/>
  <ellipse cx="64" cy="196" rx="10" ry="5.5" fill="#111111" transform="rotate(-6 64 196)"/>
  <ellipse cx="98" cy="196" rx="10" ry="5.5" fill="#111111" transform="rotate(6 98 196)"/>
  <path d="M28,202 C164.0,199.5 164.0,204.5 300,202" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/><g stroke="#111111" stroke-width="2" stroke-linecap="round" fill="none"><path d="M250,202 C247,194 246,193 245,191"/><path d="M253,202 C253,193 253,192 252,189"/><path d="M256,202 C258,195 259,194 261,192"/></g>
  <!-- accents live on props only -->
  <rect x="176" y="166" width="52" height="36" rx="3" fill="none" stroke="#111111" stroke-width="3.4"/>
  <rect x="176" y="166" width="52" height="10" rx="3" fill="#E4623E" stroke="#111111" stroke-width="3.4"/>
  <g clip-path="url(#clip-an1)" stroke="#111111" stroke-width="1.5" opacity=".85"><line x1="206" y1="200" x2="228" y2="178"/><line x1="212" y1="200" x2="234" y2="178"/><line x1="218" y1="200" x2="240" y2="178"/><line x1="224" y1="200" x2="246" y2="178"/></g><defs><clipPath id="clip-an1"><rect x="206" y="178" width="20" height="22"/></clipPath></defs>
  <line x1="286" y1="202" x2="286" y2="126" stroke="#111111" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M286,128 L322,138 L286,150 Z" fill="#1A4081" stroke="#111111" stroke-width="2.6" stroke-linejoin="round"/>
  <g stroke="#1A4081" stroke-width="1.4" stroke-dasharray="3 4" fill="none">
    <path d="M95,33 L150,26 L360,26"/>
    <path d="M100,44 L150,66 L360,66"/>
    <path d="M88,62 L150,106 L360,106"/>
    <path d="M104,104 L150,146 L360,146"/>
    <path d="M116,133 L150,186 L360,186"/>
    <path d="M300,150 L330,226 L360,226"/>
  </g>
  <g font-family="Gabarito, Trebuchet MS, sans-serif" font-size="13" font-weight="700" fill="#111111">
    <text x="368" y="30">Egg-shaped head, slightly oversized. White inside, heavy black outline.</text>
    <text x="368" y="70">Baseball cap, always: domed crown, button, panel seams, hatched brim.</text>
    <text x="368" y="110">Solid oval eyes, thick angled brows, a small curled nose, curved smile.</text>
    <text x="368" y="150">A T-shirt with short sleeves — the torso is drawn, not a single line.</text>
    <text x="368" y="190">Thin limbs ending in solid black mitten hands and shoe blobs.</text>
    <text x="368" y="230">Accent colours live on props and environment only. Never on him.</text>
  </g>
</svg>
