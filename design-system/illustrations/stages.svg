<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 40 660 175" role="img" aria-labelledby="tst" style="max-width:100%;height:auto">
  <title id="tst">Stick figure walking past six numbered stage posts that rise towards a flag.</title>
  <rect x="-600" y="-600" width="2400" height="2400" fill="#ffffff"/>

  <path d="M150,194 C260,190 420,180 600,168" fill="none" stroke="#111111" stroke-width="2.4"
    stroke-dasharray="7 8" stroke-linecap="round" opacity=".55"/>
  <line x1="196" y1="194" x2="196" y2="173" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <circle cx="196" cy="152" r="21" fill="#E4623E" stroke="#111111" stroke-width="2.8"/>
  <text x="196" y="159" text-anchor="middle" font-family="Gabarito, Trebuchet MS, sans-serif" font-size="20" font-weight="800" fill="#fff">1</text>
  <line x1="268" y1="194" x2="268" y2="163" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <circle cx="268" cy="142" r="21" fill="#1A4081" stroke="#111111" stroke-width="2.8"/>
  <text x="268" y="149" text-anchor="middle" font-family="Gabarito, Trebuchet MS, sans-serif" font-size="20" font-weight="800" fill="#fff">2</text>
  <line x1="340" y1="194" x2="340" y2="153" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <circle cx="340" cy="132" r="21" fill="#E4623E" stroke="#111111" stroke-width="2.8"/>
  <text x="340" y="139" text-anchor="middle" font-family="Gabarito, Trebuchet MS, sans-serif" font-size="20" font-weight="800" fill="#fff">3</text>
  <line x1="412" y1="194" x2="412" y2="143" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <circle cx="412" cy="122" r="21" fill="#1A4081" stroke="#111111" stroke-width="2.8"/>
  <text x="412" y="129" text-anchor="middle" font-family="Gabarito, Trebuchet MS, sans-serif" font-size="20" font-weight="800" fill="#fff">4</text>
  <line x1="484" y1="194" x2="484" y2="133" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <circle cx="484" cy="112" r="21" fill="#E4623E" stroke="#111111" stroke-width="2.8"/>
  <text x="484" y="119" text-anchor="middle" font-family="Gabarito, Trebuchet MS, sans-serif" font-size="20" font-weight="800" fill="#fff">5</text>
  <line x1="556" y1="194" x2="556" y2="123" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <circle cx="556" cy="102" r="21" fill="#1A4081" stroke="#111111" stroke-width="2.8"/>
  <text x="556" y="109" text-anchor="middle" font-family="Gabarito, Trebuchet MS, sans-serif" font-size="20" font-weight="800" fill="#fff">6</text>
  <line x1="600" y1="170" x2="600" y2="66" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <path d="M600,68 L640,80 L600,92 Z" fill="#E4623E" stroke="#111111" stroke-width="2.4" stroke-linejoin="round"/>
  
  <!-- head -->
  <circle cx="80" cy="54" r="20" fill="#fff" stroke="#111111" stroke-width="3.2"/>
  <!-- baseball cap: crown + peak, white with cross-hatching, never coloured -->
  <defs>
    <clipPath id="crown-st"><path d="M60.5,45 C60,20 100,19.5 99.5,45 Z"/></clipPath>
  </defs>
  <path d="M60.5,45 C60,20 100,19.5 99.5,45" fill="#fff" stroke="#111111" stroke-width="3.2" stroke-linejoin="round"/>
  <g clip-path="url(#crown-st)" stroke="#111111" stroke-width="1.5" opacity=".7">
    <line x1="62" y1="47" x2="82" y2="21"/>
    <line x1="71" y1="47" x2="91" y2="22"/>
    <line x1="80" y1="47" x2="99" y2="26"/>
    <line x1="89" y1="47" x2="101" y2="34"/>
  </g>
  <path d="M98.5,45 C110,41 122,44 127,50.5 C118,54.5 105,52.5 98,48.5 Z"
    fill="#fff" stroke="#111111" stroke-width="3.2" stroke-linejoin="round"/>
  <line x1="60.5" y1="45" x2="99.5" y2="45" stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
  <!-- face: dot eyes, curved mouth, short angled brows. no nose, no ears -->
  <circle cx="73" cy="59" r="2.5" fill="#111111"/>
  <circle cx="87" cy="59" r="2.5" fill="#111111"/>
  <line x1="68.5" y1="52.5" x2="77" y2="50.5" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="83" y1="50.5" x2="91.5" y2="52.5" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M73,67 Q80,72.5 87,66.5" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round"/>
  <!-- neck, torso, legs -->
  <g fill="none" stroke="#111111" stroke-width="3.4" stroke-linecap="round">
    <line x1="80" y1="74" x2="80" y2="84"/>
    <path d="M80,84 L80.5,140"/>
    <path d="M80.5,140 L62,192"/>
    <path d="M80.5,140 L98.5,191"/>
    <line x1="62" y1="192" x2="53" y2="192.5"/>
    <line x1="98.5" y1="191" x2="107" y2="192"/>
  </g>
  <path d="M80,96 L58,122" stroke="#111111" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <path d="M80,96 L114,86" stroke="#111111" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <line x1="20" y1="194" x2="650" y2="194" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
</svg>
