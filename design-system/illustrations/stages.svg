<svg xmlns="http://www.w3.org/2000/svg" viewBox="-420 46 580 180" role="img" aria-labelledby="tst" style="max-width:100%;height:auto">
  <title id="tst">Stick figure walking past six numbered stage posts that rise towards a flag.</title>
  <rect x="-800" y="-800" width="3000" height="3000" fill="#ffffff"/>

